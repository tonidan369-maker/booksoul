name: booksoul
description: تطبيق BookSoul العربي للقراءة وإدارة المكتبة.
publish_to: "none"
version: 1.4.0+4
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  flutter_local_notifications: ^18.0.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#F7F4EF"
  image: assets/images/logo.png
  android_12:
    color: "#F7F4EF"

flutter_gen:
  output: lib/gen/
